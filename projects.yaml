      beside the result.
  - date: 2026-09-17
    project: "08"
    status: building
    note: >-
      PatchTST came close enough to be interesting: it matched ETS at the city and the
      boroughs and produced the lowest city error of anything built here, and still cannot
      claim it, because the gap is smaller than the uncertainty around it. It loses across
      the thirty-one dispatch areas where the ranking is decided, and costs about seventeen
      times as much to fit.
  - date: 2026-09-17
    project: "02"
    status: shipped
    note: >-
      The panel gained a twelfth model, chosen so that two of the twelve differ in
      capability and nothing else, and rank agreement rose from 0.855 to 0.879. Two
      published claims narrowed rather than grew, and the noise figure handed to the
      release-gate project was found to be understating by half. A first duplicate check
      found 36 questions appearing twice among 19,000, reported rather than quietly removed.
  - date: 2026-09-17
    project: "01"
    status: building
    note: >-
      The live demo is rebuilt for a reader who is not a specialist: every dataset and
      method in plain words, figures in units rather than bare decimals, and a calculator
      for whether a dataset is large enough to answer the question at all. Serving it under
      its own security policy found the chart legend's colours had been blocked since the
      demo went up.
  - date: 2026-09-18
    project: "08"
    status: building
    note: >-
      The last model was never trained on this data at all: Google's pretrained forecaster
      matches a gradient-boosted model fitted to these series, and beats the best
      statistical one. The write-up leads with the catch rather than burying it. Across the
      forty weeks nothing could have leaked into it is about one percent behind instead, and
      forty weeks cannot settle whether that is leakage or a frozen model going stale.
  - date: 2026-09-18
    project: "01"
    status: shipped
    note: >-
      The repository is public and tagged v0.1.0, so this page is now its README: seven
      estimators on six datasets, every score with a bootstrap interval and both baselines
      beside it, and a limitations section that says what is unfinished rather than leaving
      it out.
  - date: 2026-09-18
    project: "04"
    status: shipped
    note: >-
      All three cloud platforms ration or refuse the same frontier models to a brand new
      account, and none documents it. Amazon allowed ten requests a minute against a published
      ten thousand. Google refused the first request the account ever made, with an error
      saying slow down when no allowance had ever been set. On all three, the platform's own
      models are provisioned normally and the partner's are not.
  - date: 2026-09-18
    project: "04"
    status: shipped
    note: >-
      A Canadian deployment answers at last, though not with the model anyone wanted: the
      vendor that cannot serve these in Canada serves another there happily. Its record reads
      deployed in Canada and processed anywhere, the strongest honest claim on offer, because
      no vendor reports where a request really went. Every call now records how far it was
      allowed to travel, and a run can fail for exceeding it.
  - date: 2026-09-18
    project: "05"
    status: building
    note: >-
      Started, and re-based onto credit agreements. It reads the contract behind a corporate
      loan, resolves the defined terms each covenant depends on, and checks the ones public
      filings can support against the borrower's own reported figures. The ones they cannot
      support are cited and handed to a person rather than guessed at.
  - date: 2026-09-18
    project: "02"
    status: shipped
    note: >-
      The method is now a page: it picks the next question, updates what it believes about each
      model and stops when the two are separated, in the browser, on twelve real models'
      recorded answers. Over all sixty-six pairs it settles 53 inside three hundred questions
      where asking at random settles 38.
  - date: 2026-09-18
    project: "08"
    status: building
    note: >-
      The dashboard is live at capacity.peterparker.ca: any of the 37 series with the range
      around its forecast, that range measured through the 2020 shift, and a slider that
      turns a service level into crews on shift and prices them. Every model the plan named
      is now measured and every results table is filled.
  - date: 2026-09-19
    project: "08"
    status: shipped
    note: >-
      The repository is public: nine models measured over 911 weekly forecasts, every score
      with a bootstrap interval and the seasonal baseline beside it, and a dashboard that
      turns a service level into crews on shift. The pretrained model that never saw this
      data is on the same chart, over the only window it can honestly be read on.
  - date: 2026-09-19
    project: "12"
    status: shipped
    note: >-
      The repository and the page are public: eighteen years of Newfoundland results, 75,061
      finishes by 23,830 runners, with a predicted time, a range and a likely place for every
      registered runner. Predictions are published and hashed before the gun and scored after
      it, with the first live race on 2026-10-18.
  - date: 2026-09-19
    project: "07"
    status: building
    note: >-
      Started. It turns an access-to-information release into a review a person can check:
      every proposed redaction names the exemption category it rests on, and the tool will
      publish how often it keeps what should have gone, the number blunt PII tools never
      show. Nothing is measured yet and the repository stays private until it is.
