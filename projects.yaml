# The public content of peterparker.ca. Everything in this file is public.
#
# One-liners are the portfolio's own and match the opening paragraph of each project's
# public repository README. A project gets a page on the site when its repository is
# public; the build reads the README from GitHub and never sees private repositories.
#
# 'explainer' names a Markdown file in content/. It is the project's page until its
# repository is public, and the README replaces it the day it is, so an explainer claims
# no results and says which project has none yet.
# Status values: live, shipped, building, planned.

site:
  title: Peter Parker
  tagline: Production machine learning and applied AI, with the numbers to check.
  intro: >-
    Built in health and government, and most of it stays behind a wall. These projects put
    the work where it can be inspected: each one ends with a measured result in a table,
    reproducible from its public repository with one command.
  description: >-
    Production-grade machine learning and AI projects, each ending in a measured result a
    stranger can check.
  base_url: https://peterparker.ca
  github: https://github.com/Peter-A-P
  # Filter chips on the index, in this order. At most eight.
  themes:
    decisioning: Decisioning and forecasting
    llm-eval: LLM evaluation and cost
    agents: AI agents and automation
    grounded: Grounded generation
    platform: Platform and infrastructure
    compliance: Compliance and privacy
    realtime: Real-time systems

projects:
  - number: "01"
    themes: [decisioning]
    slug: intervention-targeting
    name: Intervention Targeting Engine
    status: shipped
    repo: Peter-A-P/intervention-targeting-engine
    demo: https://targeting.peterparker.ca
    demo_note: >-
      Six datasets, eight ways of choosing who to treat, and a budget slider. It shows where
      ranking people by risk beats every uplift model and where it is worse than picking names
      out of a hat, with a confidence range on every number and a calculator for whether your
      own data could answer the question at all.
    technical_line: >-
      Rosenbaum bounds and E-values · uplift modelling, not risk ranking ·
      Dragonnet neural network (PyTorch) · budget-constrained allocation ·
      LightGBM meta-learners (S/T/X/DR/R) · Qini and realised policy value ·
      bootstrap interval on every score · Polars pipeline, committed seeds
    one_liner: >-
      Tells an organisation which customers, cases or patients to spend a limited
      intervention budget on: only the ones whose outcome the intervention actually changes.
      Retention offers, outreach, fraud review, clinical follow-up: a large share of every
      such budget goes to people who would have behaved the same way regardless. Ranking by
      risk finds a different list, and usually the wrong one.

  - number: "02"
    themes: [llm-eval]
    slug: model-selection
    name: Model Selection at a Tenth of the Cost
    status: shipped
    repo: Peter-A-P/model-selection-tenth-cost
    demo: https://adaptive.peterparker.ca
    demo_note: >-
      Pick two AI models and watch a test decide which is better, one question at a time, on
      the answers twelve real models gave. Beside it the same two are asked questions at
      random, with the same budget, and usually fail to settle it at all. There is a button
      that runs all sixty-six pairs, and a chart showing where the method stops winning.
    technical_line: >-
      adaptive testing, Fisher information · item response theory (2PL/3PL) ·
      marginal maximum likelihood by EM · items needed per effect size ·
      item bank, public per-item results · contamination: release-date DIF ·
      local dependence, dimensionality · test-retest, position bias, framing
    one_liner: >-
      Answers "which AI model should we use, and did the new version get worse?" with
      statistical confidence, using a fraction of the evaluation calls a full benchmark
      needs. For a team re-evaluating models every month, that is a day instead of a week
      and tens of dollars instead of thousands, and it names the benchmark questions that
      were never measuring anything.

  - number: "03"
    themes: [llm-eval, compliance]
    slug: ai-release-gate
    name: AI Release Gate
    status: shipped
    repo: Peter-A-P/ai-release-gate
    technical_line: >-
      LLM eval platform (Python, SQLite) · five repeats set the noise floor ·
      judge calibrated on human labels · noise floor measured 0.2% to 5.0% ·
      deterministic graders, no model judge · paired non-inferiority testing ·
      CI regression gating in GitHub Actions · measured false-block rate
    one_liner: >-
      No prompt or model change reaches users unless it is proven not to have regressed: the
      discipline a test suite gives code, applied to AI, with an audit trail a regulator can
      read. Includes a public month-by-month record of how the major vendors' "frozen"
      models silently change, the evidence teams wish they had when something breaks.
    note: Publishes a monthly public record of frontier-model drift.

  - number: "04"
    themes: [compliance, platform]
    slug: compliant-ai-gateway
    name: Inside the Boundary, On the Record
    status: shipped
    repo: Peter-A-P/compliant-ai-gateway
    explainer: content/04-compliant-ai-gateway.md
    technical_line: >-
      data-residency routing per request · provider routing by configuration ·
      per-team budgets enforced pre-call · span and cost record per call ·
      hash-chained, tamper-evident log · reversible PII redaction (Presidio) ·
      semantic cache on Redis and pgvector · latency overhead per control
    one_liner: >-
      An AI gateway that lets a bank, insurer, hospital or government department use
      frontier AI models without personal data ever leaving the boundary, with a
      tamper-evident record of every call and a hard cap on every team's spend. The blocker
      most regulated organisations cite for AI adoption, removed, with the latency overhead
      measured rather than promised.
    note: Every model call in this portfolio routes through it.

  - number: "05"
    themes: [compliance, grounded]
    slug: credit-agreement-covenant-monitor
    name: Every Promise in the Loan Agreement, Checked
    status: building
    repo: Peter-A-P/credit-agreement-covenant-monitor
    technical_line: >-
      multi-hop retrieval over credit agreements · defined-term resolution ·
      table-aware chunking · hybrid retrieval (BM25 plus dense) ·
      cross-encoder reranking · covenant arithmetic checked against filings ·
      verifier tested by mutation
    one_liner: >-
      Reads a three-hundred-page credit agreement, resolves the private dictionary of
      defined terms behind each covenant, and computes every promise the borrower's own
      filed accounts can support. The ones they cannot are cited and handed to a person
      rather than guessed at. A lender doing this by hand across hundreds of positions
      finds out about a breach a quarter late; this finds out the quarter it happens.

  - number: "06"
    themes: [llm-eval, platform]
    slug: fraction-of-the-bill
    name: Frontier Quality at a Fraction of the Bill
    status: building
    repo: Peter-A-P/fraction-of-the-bill
    technical_line: >-
      QLoRA fine-tuning (PyTorch, PEFT) · vLLM and llama.cpp serving ·
      AWQ / GPTQ / GGUF quantisation · break-even volume by utilisation ·
      throughput at four concurrencies · structured extraction, XBRL truth ·
      Pareto of quality, latency and cost · non-inferiority against the API
    one_liner: >-
      Proves, with measurements, that a small model an organisation owns and hosts matches a
      frontier API on a high-volume task at a small fraction of the per-call cost, and shows
      exactly at what volume the switch pays for itself. For a team spending five figures a
      month on API calls, this is the project that finds most of it: the quality gap
      measured on identical items, and the break-even published as a curve you can put your
      own prices into.

  - number: "07"
    themes: [compliance, grounded]
    slug: access-to-information-redaction
    name: Access-to-Information Redaction
    status: building
    repo: Peter-A-P/access-to-information-redaction
    technical_line: >-
      context-dependent PII redaction · leak rate per category, with CIs ·
      layout parsing and OCR (PyMuPDF) · Presidio and spaCy detection ·
      exemption categories, rules plus LLM · PDF text-layer leak test ·
      page-by-page reviewer workflow · over-redaction rate published
    one_liner: >-
      Turns an access-to-information request from days of staff reading into hours of
      review: every proposed redaction carries the exemption category it rests on, a
      reviewer approves page by page with a full audit log, and the tool publishes how often
      it withholds what must go and, the number blunt PII tools never show, how often it
      keeps what must stay. Scanned records as well as native ones, with the OCR error rate
      printed beside the redaction rates.

  - number: "08"
    themes: [decisioning]
    slug: capacity-planning-forecaster
    name: How Many Crews, and How Sure
    status: shipped
    repo: Peter-A-P/capacity-planning-forecaster
    demo: https://capacity.peterparker.ca
    demo_note: >-
      Twenty-one years of emergency calls, forecast a fortnight ahead with a range around
      every number, and a slider that turns that range into crews on shift. It opens on
      March 2020, where the range breaks and the guarantee fails, which is the part a quiet
      test set never shows.
    technical_line: >-
      hierarchical probabilistic forecasting · skill against seasonal naive ·
      adaptive conformal intervals · LightGBM, N-HiTS, PatchTST, TimesFM ·
      statistical baselines · CRPS and pinball loss · MinT reconciliation ·
      staffing cost against an oracle · coverage held through a shift
    one_liner: >-
      Forecasts demand (emergency-department arrivals, call volume, orders) with uncertainty
      ranges that actually hold when conditions shift, and turns them into a staffing number
      at a chosen service level. Overstaffing costs money and understaffing costs patients
      or customers; this puts a defensible number on both, site by site, rolling up to the
      region.

  - number: "09"
    themes: [decisioning, realtime, platform]
    slug: realtime-risk-platform
    name: Real-Time Fraud and Risk Decisioning Platform
    status: building
    repo: Peter-A-P/realtime-risk-platform
    technical_line: >-
      Kafka-compatible streaming (Redpanda) · point-in-time leakage test ·
      thousands of events per second · Feast store, online/offline parity ·
      XGBoost and FT-Transformer (PyTorch) · p99 under fifty milliseconds ·
      shadow deployment and rollback · expected-loss review queue
    one_liner: >-
      Scores every transaction in under 50 milliseconds, thousands per second, before the
      money moves, and keeps working as fraud patterns shift, without the training-versus-
      production mismatch that quietly breaks most deployed models. The platform around the
      model is what organisations are actually missing, and this is a working one you can
      watch run: live behind a public dashboard, reproducible from one command.

  - number: "10"
    themes: [agents, platform]
    slug: self-healing-production-ai
    name: Self-Healing Production AI
    status: planned
    repo: Peter-A-P/self-healing-production-ai
    technical_line: >-
      agentic incident triage (LangGraph) · failing test before any fix ·
      confidently-wrong rate published · failure clustering into one ticket ·
      adversarial second-vendor review · honest hit rate on hidden tests ·
      confidence routing with thresholds · human-gated pull requests
    one_liner: >-
      When a production system fails, this captures the failure with its context, groups
      twenty symptoms of one bug into one ticket, writes a failing test that proves the bug,
      drafts the fix, has a second AI review it adversarially, and hands an engineer a
      ready-to-approve pull request. Triage in minutes instead of days, engineers back on
      new work, and nothing changes without a person saying yes. The headline number is how
      often it would have been confidently wrong.

  - number: "11"
    themes: [agents, decisioning]
    slug: overload
    name: 'Overload: AI Coaching Team for Runners'
    status: live
    repo: Peter-A-P/TrainAI
    explainer: content/11-overload.md
    technical_line: >-
      Opus head coach, Sonnet specialists · VDOT from every training run ·
      human-approved plans, costed per call · LangGraph coaching staff ·
      pace corrected for heat, sun, hills · guardrails in code, not prompts ·
      Strava, Garmin and Open-Meteo · race projection and age grading
    one_liner: >-
      A coaching team for runners: AI specialists in injury prevention, fitness and race
      planning report each week to a head coach that writes next week's plan from what was
      actually run, and talks it through before anything is committed. Built by a data
      scientist and race-winning road runner after years on Garmin, Strava and
      TrainingPeaks.
    note: In private use since 2025; opens with its first measured result.

  - number: "12"
    themes: [decisioning]
    slug: finish-line-forecast
    name: The Whole Field, Called Before the Gun
    status: shipped
    repo: Peter-A-P/finish-line-forecast
    demo: https://finishline.peterparker.ca
    demo_note: >-
      Eighteen years of Newfoundland road results, 75,061 finishes, turned into a predicted
      time, a range it should land in and a likely place for every runner on the start list.
      The predictions are written down and hashed before the gun, and the error is published
      once the results are in.
    technical_line: >-
      pre-registered predictions · two models over sparse histories ·
      conformal intervals by history depth · placing simulated from the field ·
      course, heat and wind normalisation · public race results only ·
      predictions tagged before the gun · error published after the race
    one_liner: >-
      Before the gun, a predicted finish time and placing for every registered runner in a
      field of thousands, from their public race history, published in advance, with the
      error published once the results are in. For a runner that is a goal time with an
      honest range instead of a hunch; for a race director it is pacing, corral and medical
      staffing planned from expected finish times rather than guesses.

  - number: "13"
    themes: [grounded, agents]
    slug: grounded-email-response-drafting
    name: Grounded Email Response Drafting
    status: planned
    repo: Peter-A-P/grounded-email-response-drafting
    technical_line: >-
      grounded response drafting · FastAPI reviewer UI · cents per draft ·
      hybrid retrieval over a policy corpus · LangGraph triage and drafting ·
      human approval before sending · citation precision and coverage ·
      faithfulness with a calibrated judge · escalation when policy is silent
    one_liner: >-
      For an inbox that receives hundreds of thousands of enquiries a year, a draft reply
      for each one, grounded in the organisation's own documents, with every claim cited to
      the passage that supports it and a clear escalation when the documents cannot answer.
      A person reads, edits and sends; the system sends nothing. Minutes per reply instead
      of tens of minutes, at cents per draft, with faithfulness measured against the
      passages rather than hoped for.

  - number: "14"
    themes: [grounded, agents]
    slug: department-news-digest
    name: Department News Digest
    status: building
    repo: Peter-A-P/department-news-digest
    explainer: content/14-department-news-digest.md
    technical_line: >-
      multi-source ingestion · cited summarisation · DuckDB storage ·
      RSS, GDELT, Reddit and Bluesky · per-audience relevance ranking ·
      precision and recall on a labelled week · clustering and deduplication ·
      quote verification against source · LangGraph on GCP Cloud Run
    one_liner: >-
      One product, configured per department in a few lines, that reads the day's news,
      public forums and social feeds, removes the duplicates, ranks what matters to that
      audience, and delivers a short digest with every claim cited and every quote verified
      against its source. One system in place of dozens of people each doing this by hand,
      at a few dollars a month per department, with precision and recall measured against a
      hand-labelled week.

