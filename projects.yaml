  - date: 2026-09-12
    project: "12"
    status: building
    note: >-
      The archive was twice the size it looked: older index pages name the road section
      differently, so eight years read as empty without an error. Eighteen years now, 287
      races and 74,000 finishes. It did not fix the real problem, because the third of every
      field with no history barely moved.
  - date: 2026-09-13
    project: "12"
    status: building
    note: >-
      Course difficulty and weather both turned out to be measurable from the results
      themselves rather than from maps and physics. The flagship hill is pinned to a tenth
      of a percentage point from 5,000 finishes, and the elevation the race publishes agrees
      with it. A single wind figure for the whole province was measuring nothing at all.
  - date: 2026-09-13
    project: "08"
    status: building
    note: >-
      The statistical models are measured over 964 weekly forecasts spanning eighteen years.
      ETS beats the seasonal naive baseline by 18% at the city and a quarter at the dispatch
      areas. MSTL's 90% ranges held only 70 to 78% of outcomes, a fault traced to the
      library rather than to the method.
  - date: 2026-09-13
    project: "02"
    status: shipped
    note: >-
      The panel of current models is run, the half that costs money and the only half that
      tests the claim on models the question properties were never fitted to. Eleven models
      from four vendors and two more on a laptop answered the same 3,000 questions for
      eighteen dollars, and nothing was refitted. A hundred adaptively chosen questions
      reach the same 0.855 rank agreement for 72 cents against sixteen dollars.
  - date: 2026-09-13
    project: "03"
    status: building
    note: >-
      The first official run of the frozen suite is in: 16,800 calls across
      four vendors for US$19.53. The noise floor the whole project rests on is measured
      rather than assumed for the first time, at 0.2% to 5.0% by model. Hand-labelling then
      caught the refusal classifier missing refusals, always in that one direction.
  - date: 2026-09-14
    project: "08"
    status: building
    note: >-
      A global LightGBM model, learning from every series at once and the only one allowed
      to see public holidays, tied ETS at the city, the boroughs and the dispatch areas,
      with every difference smaller than its own uncertainty. That sharpens the next
      comparison: a neural win now cannot be put down to learning across series or to the
      calendar.
  - date: 2026-09-15
    project: "08"
    status: building
    note: >-
      The first neural model lost, and lost everywhere. N-HiTS came out a fifth worse than
      ETS at the city and a quarter worse at the dispatch areas, did not beat the seasonal
      baseline, and took ten times the compute. Three ways it might have been treated
      unfairly were checked and ruled out.
  - date: 2026-09-14
    project: "04"
    status: shipped
    note: >-
      The library every other project's model calls go through is public and measured: 2.5ms
      per call at the median and under 5ms at the 95th, with intervals on both. Six hundred
      calls were faulted deliberately, including killing the process part-way through one,
      and every one still left a row in the ledger. The ledger checked against actual vendor
      invoices waits for October.
  - date: 2026-09-14
    project: "04"
    status: shipped
    note: >-
      The cost record is checked against something other than itself for the first time:
      70,000 calls from three projects merged to US$61, agreeing with the release-gate
      project's own separate accounting to within a ten-thousandth of a cent. Vendor
      invoices still have to wait for October. Checking it also turned up a bug that could
      silently drop committed ledger rows.
  - date: 2026-09-14
    project: "04"
    status: shipped
    note: >-
      A second thing that did not work is published with the evidence: pricing a call from a
      token count worked out on your own machine. Over 16,000 real calls the monthly total
      is almost exactly right while the typical single call is wrong by a third, because the
