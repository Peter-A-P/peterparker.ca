  - date: 2026-09-14
    project: "04"
    status: shipped
    note: >-
      Bulk work now costs about half what it did on three more vendors, where batching had
      worked for one. Adapters for Microsoft's and Google's platforms are written against
      their published interfaces but not yet called. Writing them settled the residency
      question: a model deployed in Canada is available, guaranteed Canadian processing
      usually is not.
  - date: 2026-09-14
    project: "04"
    status: shipped
    note: >-
      The account was opened and the residency answer narrowed again: Microsoft offers no
      Canadian option for these models at all, and the vendor's own region table agrees. Its
      deployment screen states the distinction more plainly than any policy document, that
      processing may be global while storage stays regional. A rule written about storage
