  - date: 2026-09-12
    project: "12"
    status: building
    note: >-
      The results are in and read: ten years of them, forty-four thousand finishes, fifteen
      thousand runners picked out of pages that carry no runner identifier at all. The first
      measurement says a third of the people in any given race have never run one here
      before, which is the part of the problem worth solving.
  - date: 2026-09-12
    project: "12"
    status: building
    note: >-
      The archive turned out to be twice the size it looked. A start list showed sixty-seven
      runners whose first ever race was the exact year the reader began, which is the shape
      a history makes when it has been cut off rather than when it began; the cause was that
      the older index pages call their road section by a different name, so eight years read
      as empty without an error. Eighteen years now: two hundred and eighty-seven races,
      seventy-four thousand finishes, and the flagship course goes from nine editions to
      sixteen. It did not fix the real problem. The third of every field with no history at
      all barely moved, so those are people who have genuinely never raced here.
  - date: 2026-09-13
    project: "12"
    status: building
    note: >-
      Two layers went in: how hard each course is, and what the weather on the day costs.
      Both were meant to come from maps and physics, and both turned out to be measurable
      from the results themselves, far more precisely. The flagship hill course is pinned to
      a tenth of a percentage point from five thousand finishes, and the elevation figures
      the race publishes agree with it when put through the physics, which is a better claim
      than either on its own. The weather took two wrong answers first, one of them a null
      that was really an artefact of counting a thirty-runner race and a four-thousand-runner
      race equally. And the wind needed local knowledge before the data would give it up: the
      prevailing westerly pushes one race along and holds the other back, so a single
      wind-speed number for the whole province was measuring nothing at all.
  - date: 2026-09-13
    project: "08"
    status: building
    note: >-
      The statistical models are measured over nine hundred and sixty-four weekly forecasts
      spanning eighteen years. The best of them, ETS, beats the seasonal naive baseline by
      eighteen percent at the city and a quarter at the dispatch areas, and beats Theta by a
      margin so small that only comparing the two forecast by forecast showed it was real.
      MSTL was the surprise: its ranges held seventy to seventy-eight percent of outcomes
      where they promised ninety, and the cause is in the library, which adds the seasonal
      pattern to every quantile as a fixed amount and so never counts the uncertainty in it.
      A global LightGBM model is built next to them, to tell how much of any later gain comes
      from learning across series rather than from deep learning.
  - date: 2026-09-13
    project: "02"
    status: shipped
    note: >-
      The panel of current models is run, which is the half of this project that costs money
      and the only half that tests the claim on models the question properties were never
      fitted to. Eleven models from four vendors and two more on a laptop answered the same
      three thousand questions, for eighteen dollars. The properties came from a hundred and
      fifty other people's models and nothing was refitted, and they rank these eleven at a
      rank agreement of 0.855. A hundred adaptively chosen questions reach that same figure
      for seventy-two cents against sixteen dollars to ask all of them. Two faults had to be
      found first and neither announced itself: a question the bank could not place erased
      the model that answered it, and a model cut off partway through by a vendor quota was
      being compared against models that had answered a different set of questions, which
      reversed the conclusion until the comparison was put on a common footing.
  - date: 2026-09-13
    project: "03"
    status: building
    note: >-
      The first official run of the frozen suite went two weeks early: sixteen thousand
      eight hundred calls to eight model configurations across four vendors, for nineteen
      dollars and fifty-three cents, with five failures. The noise floor the whole project
      rests on is measured rather than assumed for the first time, and it runs from a fifth
      of a percent to five percent depending on the model. Then the hand-labelling pass on
      the refusal classifier found it wrong in the only two places a published claim about a
      vendor's safety behaviour can come from, twenty-four times out of twenty-four and four
      out of four, always in the same direction: it never invents a problem, it only misses
      one. Half of that was one missing word, where "cannot write" was recognised and "can't
      write" was not, so whether a refusal counted turned on a contraction. The other half
      cannot be fixed by any list of words, because those models were answering a harmless
      reading of a deliberately ambiguous question and using no refusing language at all, and
      a classifier tuned until it catches them is a classifier tuned until every vendor looks
      safe. That one is published as a limitation with both numbers side by side. Fixing the
      first half then exposed a third fault that neither would have shown alone: the report
      was mixing two generations of grader in one table, calling the same three answers
      refusals in one column and failures to refuse in the next.
  - date: 2026-09-14
    project: "08"
    status: building
    note: >-
      A global LightGBM model, learning from every series at once and the only model allowed
      to see public holidays, tied ETS at the city, the boroughs and the dispatch areas:
      every difference between the two was smaller than the uncertainty around it. That
      makes the next comparison sharper, because if a neural model now beats ETS, the gain
      cannot be put down to learning across series or to the calendar. One number had to be
      taken back along the way. The cost of a fit was first measured while other work shared
      the machine, and came out at four times its real figure of about seven seconds.
  - date: 2026-09-14
    project: "04"
    status: shipped
    note: >-
      The library every other project's model calls go through is public and measured. Its
      own cost per call is two and a half milliseconds at the median and under five at the
      ninety-fifth, over a thousand calls with intervals on both. Six hundred calls were put
      through faults deliberately, including killing the process part-way through one, and
      every one of them still left a row in the ledger. Seventeen calls were aimed past a
      spend cap and none of them reached a vendor. Five hundred pass-through calls came back
      byte for byte identical. The number that matters most for the cost claim is the one
      still missing: the ledger checked against the actual vendor invoices, which has to wait
      for October because the invoices do. Three hyperscaler adapters are still to come, and
      the redaction, residency and audit half of this project is May 2027.
  - date: 2026-09-14
    project: "04"
    status: shipped
    note: >-
      The cost record has now been checked, for the first time, against something other than
      itself. Seventy thousand calls from three projects were merged into one ledger and came
      to sixty-one US dollars, and for the thirty-five thousand of them belonging to the
      release-gate project that total agrees with that project's own separate accounting to
      within a ten-thousandth of a cent. That is not the vendor invoices, which still have to
      wait for October because the invoices do, but it is the step most likely to go wrong
      quietly and it did not. Nine calls in the month are recorded as uncosted, because the
      price of that model was not known at the moment they were made and the rule is that an
      unknown price is left blank rather than guessed. Checking the work also turned up a
      small bug in it: gathering the ledgers by hand can silently drop rows that the database
      has committed but not yet written to its main file, which would have looked like a
      vendor overcharging rather than a mistake in the method.
  - date: 2026-09-14
    project: "04"
    status: shipped
    note: >-
      A second thing that did not work is published, with the evidence. The idea was to price
      a call from a token count worked out on your own machine, instead of waiting for the
      number the vendor sends back, which would let a spend limit be exact rather than
      cautious. Measured over sixteen thousand real calls it fails in the way that is hardest
      to notice: the monthly total comes out almost exactly right while the typical single
      call is wrong by a third, because over-estimates and under-estimates cancel out. A
      spend limit is checked one call at a time, so a method that is right on average and
      wrong on every row is no use for the thing the number is actually for. Even the vendor's
      own tokenizer, run against that vendor, is consistently short.
  - date: 2026-09-14
    project: "04"
    status: shipped
    note: >-
      Bulk work now costs about half what it did on three more vendors. Sending many requests
      together at a discount previously worked for one vendor only, so a sister project sent
      nine thousand of its calls the cheap way and eighteen thousand at full price for want of
      the plumbing. Two more model platforms, Microsoft's and Google's, also have adapters
      written against their published interfaces, though neither has been called yet because
      neither account exists. Writing them settled a question the compliance half of this
      project rests on, and the honest answer is narrower than the phrase "data residency"
      suggests: you can have a model deployed in Canada, but guaranteed Canadian processing is
      usually not on offer at any price. The record says where a request was sent, which is
      the part a gateway controls, and it is careful not to imply the other thing.
  - date: 2026-09-14
    project: "04"
    status: shipped
    note: >-
      Then the account was actually opened, and the residency answer got narrower again. On
      Microsoft's platform there is no Canadian option for these models at all: a resource
      created in Canada Central offers none of them to deploy, and the vendor's own region
      table agrees, with every row blank against both Canadian regions. The narrower setting
      that keeps processing inside one country exists only for the United States. Microsoft's
      deployment screen states the underlying distinction more plainly than any policy
      document does, and it is worth quoting: data might be processed globally, outside the
      resource's geography, but data storage remains within it. Processing is global; storage
      is regional. A rule written about where data is stored can be satisfied. The same rule
      written about where it is processed cannot, and the two are routinely written as if they
      were one obligation.
  - date: 2026-09-14
    project: "04"
    status: shipped
    note: >-
      One more turn of the same screw, and this one is about procurement rather than
      engineering. Nothing would deploy at all: every attempt came back saying there was
      insufficient capacity. Asking the platform's own interface for the actual numbers, rather
      than reading its error message, gave the answer in one command. The account has nineteen
      separate allowances for this vendor's models in that region and every one of them is
      zero, while a hundred and fifty-nine allowances for other models in the same region and
      the same account are perfectly healthy. The published documentation says an account of
      this type is granted a working allowance by default. It is not. The number it describes
      is a ceiling that may be requested, not an allowance that arrives, and the request is
      reviewed case by case with no stated wait and no guarantee. So there is a gate before the
      first call that is neither technical nor priced, which is the sort of thing that belongs
      in a go-live plan rather than a troubleshooting note. Three earlier readings of this
      failure, two of them published here, were wrong: the error invites you to change the
      region, the configuration or the account, and none of those is the cause. Inferring from
      an error message instead of looking up the number is the exact failure this project
      exists to catch in other people's claims, and it happened three times here in a day,
      which is why the command that settles it is now written down beside the answer.
  - date: 2026-09-14
    project: "03"
    status: shipped
    note: >-
      The repository is public with its first month of the record in it, and every raw
      response committed alongside, so any figure in it can be regenerated from disk without
      calling a vendor or spending anything. Opening it up also turned the lights on: three
      commits had been failing continuous integration unnoticed, because the check being run
      by hand covered the library and the one in the pipeline covered the tests as well. The
      twelve months of drift measurement start from here, so this is a beginning rather than
      an ending, but the thing a stranger can now check exists.
  - date: 2026-09-11
    project: "01"
    status: building
    note: >-
      All five meta-learners are built and benchmarked against both baselines, and the two
      largest datasets are loaded at full size, fourteen million randomised ad impressions
      among them. The first thing they showed is that the risk-ranking trap the project is
      built around is conditional: it springs on one dataset and not on another, and a test
      now asserts the difference.
  - date: 2026-09-12
    project: "01"
    status: building
    note: >-
      Every ranking is now priced at a budget rather than only scored on a curve, by two
      independent estimators of what following it would actually have bought, and the
      benchmark checkpoints its work so an interruption costs one fit rather than a night.
      A cheap diagnostic, one outcome model, says in advance whether a problem is the kind
      where ranking by risk is a trap or the kind where it is fine.
  - date: 2026-09-13
    project: "01"
    status: building
    note: >-
      The sensitivity section is built, with three devices that answer different questions
      about unmeasured confounding and a stated limitation that none of them can fail on the
      data at hand. Dragonnet, the neural estimator, is in every table after a bug that had
      it reporting random targeting as a result on the one dataset with missing values, which
      is written up as the more useful finding of the two.
  - date: 2026-09-14
    project: "01"
    status: building
    note: >-
      The budget-slider demo is built from precomputed rankings and does no modelling in the
      browser, and the fraud worked case is built on real transaction features with an
      invented review effect that it declares in its first sentence. Hosting the demo is what
      remains before the repository goes public.
  - date: 2026-09-14
    project: "01"
    status: building
    note: >-
      The fraud worked case is measured, and the result inverts the case's own design: the
      risk queue a fraud team already runs beats every fitted uplift model at every budget
      tried, because finding fraud is worth far more than ordering within it, while a perfect
      ranking would be worth nearly twice as much again. A sign convention that had the
      benchmark and the cheap diagnostic reporting the opposite was caught by running the
      diagnostic against the allocation, fixed with a declaration on the dataset, and kept as
      a test.
  - date: 2026-09-14
    project: "01"
    status: building
    note: >-
      The budget-slider demo is live at targeting.peterparker.ca, on a second free-tier
      Static Web App beside this site's, published from the laptop with no workflow or
      credential in the repository. The repository itself stays private until the results
      table is finished.
  - date: 2026-09-14
    project: "09"
    status: building
    note: >-
      The real fraud data now runs through the same pipeline as the synthetic stream, and
      getting it there took more than a loader. The file has no merchant, and on measurement no
      device either: the columns that looked like one describe a browser and screen shared by
      thousands of shoppers, so a device feature built on them would have counted how popular a
      browser is. No column is a card, so a card is pieced together from its issuer, billing
      region and the day the account opened. Six of the sixteen features survive on real data,
      and the point-in-time test passes on all of them across 590,540 transactions. The leak it
      caught last week, remeasured with a card that is actually a card, would have corrupted 65
      rows, where grouping by the obvious but wrong card column had put the exposure at 312, and
      the first attempt at that remeasurement overcounted too, by comparing every transaction in
      a burst with the last one. The local
      streaming stack ran for the first time and failed twice before it worked: once on a
      start-up setting the broker rejects, and once on every restart after the first.
  - date: 2026-09-14
    project: "06"
    status: building
    note: >-
      Week one is built, seven months ahead of its slot, and none of it is a measurement yet:
      the fifteen-field extraction schema, a grader that names how a reading went wrong rather
      than only counting that it did, the SEC fair-access client, the rule for choosing which
      of the several correctly tagged numbers on one line of a statement is the answer, and
      the company-level splits. Nothing has been fetched, trained, quantised, served or spent.
      The fetcher refuses to start without a declared contact address, which is what the SEC
      asks of anyone reading its archive in bulk, and that refusal is why the corpus is still
      empty. Building it sent two things back to the plan. The held-out rule is now stated over
      companies rather than over filings, so that the contamination gap is measured within the
      same filers instead of across two different sets of them, where it would have mixed
      contamination with whichever set held the easier companies. And where three of the
      fifteen fields get their truth is recorded as an open question to settle against the live
      API before any filing is labelled, rather than assumed and discovered later.
